services:
  postgres:
    image: postgres:17-alpine
    container_name: corsa-postgres
    environment:
      POSTGRES_USER: corsa
      POSTGRES_PASSWORD: corsa
      POSTGRES_DB: corsa
    ports:
      - "5432:5432"
    volumes:
      - corsa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corsa -d corsa"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  corsa_pg_data:
